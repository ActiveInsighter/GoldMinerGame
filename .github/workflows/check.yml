name: Check

on:
  push:
    branches-ignore: [main, run-state]
    paths-ignore: [".github/run-state/**"]
  pull_request:
    branches: [main]
    paths-ignore: [".github/run-state/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: TypeScript check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log
      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-${{ github.run_id }}
          path: check.log
          if-no-files-found: ignore
          retention-days: 7
