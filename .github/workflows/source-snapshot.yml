name: Source Snapshot

on:
  push:
    branches: [refactor/phaser-rendering-and-art-pipeline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload editable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.run_id }}
          path: |
            .github
            src
            tests
            scripts
            public
            docs
            package.json
            package-lock.json
            tsconfig.json
            vite.config.ts
            vitest.config.ts
            playwright.config.ts
            README.md
            ASSET_TODO.md
            art-manifest.json
          include-hidden-files: true
          retention-days: 1
