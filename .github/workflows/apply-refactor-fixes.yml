name: Apply Refactor Fixes

on:
  push:
    branches: [refactor/phaser-rendering-and-art-pipeline]

permissions:
  contents: write

concurrency:
  group: apply-refactor-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/phaser-rendering-and-art-pipeline
          fetch-depth: 0
      - name: Apply exact Phaser mount correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          component = Path("src/GoldMinerGame.tsx")
          source = component.read_text()
          replacements = [
              (
                  '  const canvasRef = useRef<HTMLCanvasElement | null>(null);',
                  '  const gameHostRef = useRef<HTMLDivElement | null>(null);',
              ),
              (
                  '    if (screen !== "game" || !session || !canvasRef.current) return;',
                  '    if (screen !== "game" || !session || !gameHostRef.current) return;',
              ),
              (
                  '      canvas: canvasRef.current,',
                  '      parent: gameHostRef.current,',
              ),
              (
                  '            <canvas ref={canvasRef} className="mine-canvas" tabIndex={0} />',
                  '            <div ref={gameHostRef} className="mine-phaser-host" />',
              ),
          ]
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new, 1)
          component.write_text(source)

          stylesheet = Path("src/styles/art-pipeline.css")
          css = stylesheet.read_text()
          host_rules = '''.mine-phaser-host {
            position: absolute;
            inset: 0;
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            overflow: hidden;
          }

          .mine-phaser-host canvas {
            max-width: 100%;
            max-height: 100%;
          }

          '''
          if ".mine-phaser-host {" not in css:
              css = css.replace(".mine-canvas {", host_rules + ".mine-canvas {", 1)
          stylesheet.write_text(css)
          PY
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet -- src/GoldMinerGame.tsx src/styles/art-pipeline.css; then
            echo "Phaser mount container already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GoldMinerGame.tsx src/styles/art-pipeline.css
          git commit -m "fix: mount Phaser AUTO renderer in a container"
          git push origin HEAD:refactor/phaser-rendering-and-art-pipeline
